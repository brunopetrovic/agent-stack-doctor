name: CI

on:
  push:
    branches: [main, minimax-publication-hardening]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile-check all Python files
        run: |
          python -m py_compile src/agent_doctor/*.py
          python -m py_compile tests/*.py
        shell: bash

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build:
    name: Build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Verify artifact exists
        run: |
          ls -la dist/
          test -f dist/agent_doctor-*.whl || (echo " Wheel not found" && exit 1)
          test -f dist/agent_doctor-*.tar.gz || (echo " Tarball not found" && exit 1)

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secret patterns
        run: |
          echo "=== Scanning for potential secret patterns ==="

          # Write patterns to a temp file (avoids bash quoting issues with regex in YAML)
          cat > /tmp/secret_patterns.txt << 'PATTERNS'
          AKIA[0-9A-Z]{16}
          sk-[0-9a-zA-Z]{20,}
          ghp_[0-9a-zA-Z]{36}
          gho_[0-9a-zA-Z]{36}
          glpat-[0-9a-zA-Z]{20,}
          sq0csp-[0-9A-Za-z]{43}
          [\"'][0-9a-z]{32,32}[\"']
          PATTERNS

          FOUND=0
          while IFS= read -r pat; do
            # Skip empty lines and comment lines
            [[ -z "$pat" || "$pat" =~ ^# ]] && continue
            if grep -rE "$pat" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" --include="*.toml" --include="*.md" . 2>/dev/null | \
               grep -v ".git" | grep -v "node_modules" | grep -v "dist/" | grep -v "build/" | \
               grep -v "PATTERNS" | grep -v "secret_patterns.txt" | grep -v "secret-scan" > /dev/null 2>&1; then
              echo "ALERT: Pattern matched: $pat"
              FOUND=1
            fi
          done < /tmp/secret_patterns.txt

          if [ $FOUND -eq 1 ]; then
            echo "FAILED: Secret-like patterns found in codebase"
            exit 1
          else
            echo "PASSED: No obvious secret patterns detected"
          fi
        shell: bash
