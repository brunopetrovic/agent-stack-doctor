[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-doctor"
version = "0.1.0"
description = "AI Agent Stack Doctor – diagnose configuration failures before they bite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Bruno Petrovic"}
]
keywords = ["ai-agents", "agent-infrastructure", "diagnostics", "llmops", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/brunopetrovic/agent-stack-doctor"
Repository = "https://github.com/brunopetrovic/agent-stack-doctor"
Issues = "https://github.com/brunopetrovic/agent-stack-doctor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
agent-doctor = "agent_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"